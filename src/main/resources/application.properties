server.port=${PORT:8080}
spring.application.name=thanhnien-rss

# Logging
logging.level.com.thanhnien=INFO
logging.level.root=INFO

# Translation Configuration
# Using MyMemory API (free, no API key required)
# Limits: 1000 requests/day, 500 chars per request
translation.cache.enabled=true
translation.rate.limit.enabled=true

# Note: MyMemory API is used by default (no configuration needed)
# API: https://mymemory.translated.net/
# Free tier: 1000 requests/day

# OpenAI Configuration (for News Chatbot)
# Get your API key from: https://platform.openai.com/api-keys
openai.api.key=${OPENAI_API_KEY:}
openai.model=gpt-3.5-turbo